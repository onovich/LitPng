name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Unit, type, build, and codec checks
        run: npm run validate

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/pngquant-wasm/Cargo.toml -- --check

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify committed WASM package
        run: |
          npm run codec:build-wasm
          git diff --exit-code -- apps/web/src/codecs/pngquant-wasm

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser codec smoke
        run: npm run test:e2e
